apiVersion: v1
kind: Namespace
metadata:
  name: in-cluster-image-registry-system
---
apiVersion: v1
kind: Service
metadata:
  name: in-cluster-image-registry
  namespace: in-cluster-image-registry-system
spec:
  selector:
    app: in-cluster-image-registry
  ports:
    - port: 80
      targetPort: 5000
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: in-cluster-image-registry
  namespace: in-cluster-image-registry-system
spec:
  serviceName: in-cluster-image-registry
  replicas: 1
  selector:
    matchLabels:
      app: in-cluster-image-registry
  template:
    metadata:
      labels:
        app: in-cluster-image-registry
    spec:
      containers:
        - name: registry
          image: registry:2
          ports:
            - containerPort: 5000
          volumeMounts:
            - name: data
              mountPath: /var/lib/registry
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: node-agent
  namespace: in-cluster-image-registry-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: in-cluster-image-registry-node-agent
rules:
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: in-cluster-image-registry-node-agent
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: in-cluster-image-registry-node-agent
subjects:
  - kind: ServiceAccount
    name: node-agent
    namespace: in-cluster-image-registry-system
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: node-agent
  namespace: in-cluster-image-registry-system
spec:
  selector:
    matchLabels:
      app: node-agent
  template:
    metadata:
      labels:
        app: node-agent
    spec:
      serviceAccountName: node-agent
      hostNetwork: true
      hostPID: true
      containers:
        - name: agent
          image: in-cluster-image-registry-node-agent
          securityContext:
            privileged: true
          volumeMounts:
            - name: etc-containerd
              mountPath: /etc/containerd
            - name: etc-hosts
              mountPath: /etc/hosts
      volumes:
        - name: etc-containerd
          hostPath:
            path: /etc/containerd
        - name: etc-hosts
          hostPath:
            path: /etc/hosts
