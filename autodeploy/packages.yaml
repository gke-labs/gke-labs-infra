apiVersion: infra.labs.gke.io/v1alpha1
kind: Package
metadata:
  name: autodeploy
  namespace: autodeploy-system
spec:
  repo: https://github.com/gke-labs/gke-labs-infra
  branch: main
  interval: 5m
  directory: autodeploy
---
apiVersion: v1
kind: Namespace
metadata:
  name: in-cluster-image-registry-system
---
apiVersion: infra.labs.gke.io/v1alpha1
kind: Package
metadata:
  name: in-cluster-image-registry
  namespace: in-cluster-image-registry-system
spec:
  repo: https://github.com/gke-labs/gke-labs-infra
  branch: main
  interval: 5m
  directory: in-cluster-image-registry
---
apiVersion: v1
kind: Namespace
metadata:
  name: test-runner
---
apiVersion: infra.labs.gke.io/v1alpha1
kind: Package
metadata:
  name: test-runner
  namespace: test-runner
spec:
  repo: https://github.com/gke-labs/gke-labs-infra
  branch: main
  interval: 5m
  directory: test-runner
