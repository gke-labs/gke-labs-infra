apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: buildkit-cache
  namespace: autodeploy-system
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: buildkit
  namespace: autodeploy-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: buildkit
  template:
    metadata:
      labels:
        app: buildkit
    spec:
      containers:
      - name: buildkit
        image: moby/buildkit:v0.28.0
        args:
          - --addr
          - tcp://0.0.0.0:2375
        ports:
        - containerPort: 2375
        securityContext:
          privileged: true
        volumeMounts:
        - name: buildkit-cache
          mountPath: /var/lib/buildkit
      volumes:
      - name: buildkit-cache
        persistentVolumeClaim:
          claimName: buildkit-cache
---
apiVersion: v1
kind: Service
metadata:
  name: buildkit
  namespace: autodeploy-system
spec:
  ports:
  - port: 2375
    protocol: TCP
    targetPort: 2375
  selector:
    app: buildkit
